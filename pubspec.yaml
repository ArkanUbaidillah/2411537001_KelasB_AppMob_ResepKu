name: resepku
description: "ResepKu - Praktikum Aplikasi Mobile Modul 6-10 (DIF61145)."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  cached_network_image: '>=3.4.1 <5.0.0'
  http: ^1.6.0
  shared_preferences: ^2.5.0
  sqflite: ^2.4.2
  path: ^1.9.1
  # SQLite versi komputer: sqflite tidak punya plugin Windows/Linux,
  # sehingga aplikasi Windows memakai sqflite_common_ffi (lihat main.dart)
  sqflite_common_ffi: ^2.3.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
